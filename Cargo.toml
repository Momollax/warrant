[package]
name = "warrant_fetcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "warrant_fetcher"
path = "src/main.rs"

[dependencies]
tokio    = { version = "1",      features = ["full"] }
reqwest  = { version = "0.11",   features = ["json", "rustls-tls"], default-features = false }
serde    = { version = "1",      features = ["derive"] }
serde_json = "1"
chrono   = { version = "0.4",    features = ["serde"] }
anyhow   = "1"
ratatui  = "0.28"
crossterm = "0.27"
